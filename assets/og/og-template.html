<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:ital,wght@0,400;0,600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: #f5f5f5; /* neutral-100 */
    color: #262626;      /* neutral-800 */
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 96px;
  }
  .name {
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 76px;
    font-weight: 600;
    line-height: 1.1;
    color: #171717; /* neutral-900 */
  }
  .role {
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 36px;
    font-weight: 400;
    line-height: 1.4;
    margin-top: 20px;
    color: #404040; /* neutral-700 */
  }
  .skills {
    font-size: 22px;
    font-weight: 400;
    line-height: 1.5;
    margin-top: 36px;
    color: #737373; /* neutral-500 */
  }
  .domain {
    position: absolute;
    bottom: 72px;
    left: 96px;
    font-size: 20px;
    font-weight: 500;
    color: #737373; /* neutral-500 */
  }
  .rule {
    width: 64px;
    height: 3px;
    background: #2563eb; /* blue-600 */
    margin-top: 40px;
  }
</style>
</head>
<body>
  <div class="name">Wagner Rosa</div>
  <div class="role">Senior Product Designer</div>
  <div class="rule"></div>
  <div class="skills">UX · Product Design · Design Systems · Applied AI</div>
  <div class="domain">wagnerrosa.com</div>
</body>
</html>
