<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C · Wheel — Wagner Rosa (prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<script>try { var t = localStorage.getItem('theme'); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="stylesheet" href="../shared/base.css">
<style>
  .shell { --side: minmax(400px, min(31vw, 500px)); }
  .side { padding: 0; overflow: visible; position: relative; z-index: 6; border-right: 0; }   /* visible so a long label + its % can pass the column edge */

  .wheel { position: absolute; inset: 0; cursor: grab; touch-action: none; outline: none; }
  .wheel:active { cursor: grabbing; }
  /* fade the rows out before they reach the footer text */
  .wheel ul { -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 10%, #000 82%, transparent 96%); mask-image: linear-gradient(to bottom, transparent 0, #000 10%, #000 82%, transparent 96%); }
  .wheel ul { position: absolute; inset: 0 -90px 0 0; }   /* wider than the column: the mask would otherwise clip a long label + its % at the edge */
  .wheel li { position: absolute; left: 0; top: 0; will-change: transform, opacity; white-space: nowrap; }
  .wheel a {
    display: flex; align-items: baseline; gap: 10px; text-decoration: none;
    font-size: clamp(26px, 2.6vw, 38px); font-weight: 700; letter-spacing: -.04em; line-height: 1;
    transition: color .25s;
  }
  .wheel a .n { display: none; }
  .wheel a { font-weight: 600; }
  .wheel a.on { color: var(--accent); font-weight: 700; }
  .wheel a sup { align-self: flex-start; font-size: .36em; font-weight: 500; letter-spacing: .04em; color: var(--mute); margin-left: -2px; transform: translateY(.6em); }
  .wheel a.on sup { color: var(--accent); }
  /* children: a step smaller, lighter, indented under their section */
  .wheel li.child a { font-size: clamp(16px, 1.5vw, 21px); font-weight: 500; letter-spacing: -.02em; padding-left: 32px; color: var(--ink-2); }
  .wheel li.child a.on { color: var(--accent); font-weight: 700; }

  /* the rim: only half of a big circle shows; photo + name sit inside the visible half */
  .rim { position: absolute; inset: 0; pointer-events: none; width: 100%; height: 100%; }
  .rim circle { fill: none; stroke: var(--line); stroke-width: 1; }
  .rim line { stroke: var(--line); stroke-width: 1; }
  .rim line.major { stroke: var(--line-strong); }
  .pointer { position: absolute; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); transform: translate(-50%, -50%); z-index: 2; pointer-events: none; }
  .hub {
    position: absolute; z-index: 3; left: 44px; display: flex; flex-direction: column; align-items: flex-start; gap: 0;
    text-align: left; text-decoration: none; transform: translateY(-50%);
  }
  .hub > span { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; }
  .hub img { width: clamp(64px, 5.6vw, 84px); height: clamp(64px, 5.6vw, 84px); border-radius: 50%; object-fit: cover; margin-bottom: 14px; }
  .hub b { font-size: 17px; font-weight: 700; letter-spacing: -.03em; line-height: 1.1; white-space: nowrap; }
  .hub .role { color: var(--mute); font-size: 13px; font-weight: 500; letter-spacing: -.01em; line-height: 1.3; white-space: nowrap; }
  .hub .mono { color: var(--mute); font-size: 9px; line-height: 1.35; white-space: nowrap; }
  .hub .status { margin-top: 10px; font-size: 9px; white-space: nowrap; }
  /* right pane: a vertical stack of panels driven by the same wheel (the bigger gear) */
  :root { --arc: 56px; }
  .stage { overflow: hidden; }
  .layer { position: absolute; inset: 0; overflow-x: hidden; overflow-y: auto; background: var(--paper); will-change: transform; }
  .panel .in { padding-left: clamp(20px, 2.6cqi, 40px); padding-right: calc(clamp(20px, 5cqi, 64px) + var(--arc)); }   /* room for the arc */
  [data-arc] { will-change: transform; }

  /* reading mode: a case study article locks the gear; the dial then shows reading progress */
  .layer.read { z-index: 4; outline: none; overscroll-behavior: contain; transition: transform .8s cubic-bezier(.2, .8, .2, 1); }
  /* locked gear: the rim turns blue, the pointer becomes a ring, the other rows step back and the active one counts progress */
  .rim circle { transition: stroke .6s; }
  .pointer { transition: width .4s, height .4s, background .4s, box-shadow .4s; }
  .wheel.locked .rim circle { stroke: rgb(var(--accent-rgb) / .5); }
  /* locked: the pointer turns into a close button (x) sitting on the rim */
  .wheel.locked .pointer { width: 24px; height: 24px; background: var(--paper); box-shadow: 0 0 0 1.5px var(--accent), 0 0 0 8px rgb(var(--accent-rgb) / .1); pointer-events: auto; cursor: pointer; }
  .pointer::before, .pointer::after { content: ''; position: absolute; left: 50%; top: 50%; width: 10px; height: 1.5px; margin: -.75px 0 0 -5px; border-radius: 1px; background: #fff; opacity: 0; transform: rotate(0); transition: opacity .3s, transform .4s, background .2s; }
  .wheel.locked .pointer::before { opacity: 1; background: var(--accent); transform: rotate(45deg); }
  .wheel.locked .pointer::after { opacity: 1; background: var(--accent); transform: rotate(-45deg); }
  .wheel.locked .pointer:hover { background: var(--accent); }
  .wheel.locked .pointer:hover::before, .wheel.locked .pointer:hover::after { background: var(--paper); }
  /* keyboard hints as key caps, bottom-left of the gear. They appear gradually: browse once the visitor interacts, enter on a readable case, close + scroll while reading */
  .keys { position: absolute; z-index: 3; left: 44px; bottom: 26px; pointer-events: none; }
  .keys p { display: grid; grid-template-rows: 0fr; margin: 0; opacity: 0; transition: grid-template-rows .45s cubic-bezier(.2, .8, .2, 1), opacity .45s; }
  .keys p > span { display: flex; align-items: center; gap: 5px; min-height: 0; overflow: hidden; padding: 4px 0; box-sizing: border-box; }
  .keys p > span > * { flex: none; }
  .keys kbd { display: inline-flex; align-items: center; justify-content: center; min-width: 24px; height: 24px; padding: 0 7px; box-sizing: border-box; font: 600 11px/1 var(--sans); letter-spacing: 0; color: var(--ink); background: var(--chip); border: 1px solid var(--chip-line); border-bottom-width: 2px; border-radius: 6px; }
  .keys em { margin-left: 5px; font: 500 12px/1 var(--sans); font-style: normal; letter-spacing: -.005em; color: var(--mute); }
  .side.k-nav .k-nav, .side.k-enter .k-enter, .side.k-close .k-close, .side.k-next .k-next, .side.k-scroll .k-scroll { grid-template-rows: 1fr; opacity: 1; }
  .read-body .read-end { margin-top: 4em; padding-top: 22px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 28px; font-family: var(--sans); }
  .read-body .read-end .mono { color: var(--mute); flex-basis: 100%; }
  .read-body .read-end a { font-weight: 600; font-size: 16px; letter-spacing: -.01em; }
  .wheel li.exit a { color: var(--accent); font-weight: 600; }
  .wheel li.exit a:hover { text-decoration: underline; text-underline-offset: .2em; text-decoration-thickness: 1px; }
  .wheel a sup.prog { align-self: baseline; transform: translateY(-2.5px);   /* sits on the label baseline, nudged up to the optical middle of the label */ margin-left: 10px; font: 600 11px/1 var(--sans); letter-spacing: .04em; color: var(--accent); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .read-body { max-width: 700px; padding: 40px 40px 160px; margin-left: clamp(0px, 3vw, 48px); font-family: 'Source Serif 4', Georgia, serif; font-size: clamp(18px, 1.35vw, 20px); line-height: 1.7; color: var(--read); letter-spacing: 0; }
  .read-body > * + * { margin-top: 1.3em; }
  .read-body h1 { font: 650 clamp(32px, 3.6vw, 48px)/1.1 var(--sans); letter-spacing: -.04em; color: var(--ink); }
  .read-body h1 + p { margin-top: .9em; font: 500 12px/1.3 var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--mute); }
  .read-body h2 { margin-top: 2.6em; font: 650 clamp(23px, 2vw, 28px)/1.2 var(--sans); letter-spacing: -.03em; color: var(--ink); }
  .read-body h3 { margin-top: 2em; font: 600 clamp(18px, 1.5vw, 21px)/1.25 var(--sans); letter-spacing: -.02em; color: var(--ink); }
  .read-body h2 + *, .read-body h3 + * { margin-top: .8em; }
  .read-body strong { font-weight: 600; }
  .read-body a { color: var(--link); text-decoration: underline; text-underline-offset: .18em; text-decoration-thickness: 1px; }
  .read-body figure { margin-top: 2.2em; margin-bottom: 2.2em; }
  .read-body figure img { display: block; width: 100%; height: auto; border-radius: 6px; will-change: transform, opacity; }
  .read-body figure img + img { margin-top: 14px; }
  .read-body figcaption { margin-top: 10px; font: 400 13px/1.45 var(--sans); color: var(--mute); letter-spacing: -.005em; }
  .read-body ul, .read-body ol { padding-left: 1.3em; }
  .read-body li + li { margin-top: .4em; }
  .read-body blockquote { padding-left: 1.2em; border-left: 1px solid var(--line-strong); font-style: italic; }
  .read-body code { font: 500 .86em ui-monospace, Menlo, monospace; background: var(--code); padding: .1em .35em; border-radius: 4px; }
  .read-body pre { overflow-x: auto; background: var(--code-block); padding: 16px; border-radius: 6px; font-size: 14px; line-height: 1.5; }
  .read-body hr { border: 0; border-top: 1px solid var(--line); margin: 2.4em 0; }
  .read-body video { display: block; width: 100%; height: auto; border-radius: 6px; }
  .read-body dl { display: grid; gap: 1.1em; }
  .read-body dl > div { padding-left: 16px; border-left: 1px solid var(--line); }
  .read-body dt { font: 600 15px/1.3 var(--sans); letter-spacing: -.01em; color: var(--ink); }
  .read-body dd { margin: .3em 0 0; }
  .read-body .code-block { border-radius: 6px; overflow: hidden; background: var(--code-block); font-family: var(--sans); }
  .read-body .code-block > div { padding: 8px 16px; font: 500 11px/1 var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--mute); border-bottom: 1px solid var(--line); }
  .read-body .code-block pre { margin: 0; border-radius: 0; }
  .read-body .badge { display: inline-block; padding: 2px 8px; border-radius: 99px; background: var(--code); font: 500 12px/1.4 var(--sans); }
  .read-body table { width: 100%; border-collapse: collapse; font: 400 15px/1.4 var(--sans); }
  .read-body th, .read-body td { text-align: left; padding: 10px 12px 10px 0; vertical-align: top; }
  .read-body tr + tr > * { border-top: 1px solid var(--line); }

  /* theme toggle: top-left corner of the gear column */
  .theme { position: absolute; z-index: 7; top: 22px; left: 44px; width: 32px; height: 32px; display: grid; place-items: center; padding: 0; border: 1px solid var(--line); border-radius: 50%; background: transparent; color: var(--mute); cursor: pointer; transition: color .2s, border-color .2s, background .2s; }
  .theme:hover { color: var(--ink); border-color: var(--line-strong); }
  .theme svg { width: 15px; height: 15px; display: block; }
  @media (max-width: 820px) {
    .theme { top: 12px; left: auto; right: 16px; }
    :root { --arc: 14px; }
    .read-body { padding: 28px 20px 120px; margin-left: 0; }
    .keys { display: none; }
    .shell { grid-template-rows: 44dvh 1fr; }
    .side { border-bottom: 0; padding: 0; }
    .wheel { top: 58px; }
    .wheel ul { -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 12%, #000 88%, transparent 100%); mask-image: linear-gradient(to bottom, transparent 0, #000 12%, #000 88%, transparent 100%); }
    .wheel a { font-size: 26px; }
    .wheel li.child a { font-size: 17px; padding-left: 24px; }
    .hub { top: 12px !important; left: 16px !important; transform: none; flex-direction: row; gap: 10px; text-align: left; }
    .hub img { width: 36px; height: 36px; margin: 0; }
    .hub b { font-size: 17px; }
    .hub .mono { max-width: none; }
    .hub .role { font-size: 12px; }
    .panel .in { padding-left: clamp(20px, 5cqi, 64px); }
    .hub > span { align-items: flex-start; gap: 1px; }
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="wheel" id="wheel" tabindex="0" role="listbox" aria-label="Sections">
      <svg class="rim" id="rim" aria-hidden="true"></svg>
      <div class="pointer" id="pointer" aria-hidden="true"></div>
      <ul id="list"></ul>
    </div>
    <div class="keys" aria-hidden="true">
      <p class="k-enter"><span><kbd>→</kbd><em>read the case study</em></span></p>
      <p class="k-close"><span><kbd>Esc</kbd><kbd>←</kbd><em>close</em></span></p>
      <p class="k-next"><span><kbd>Space</kbd><em>next case study</em></span></p>
      <p class="k-nav"><span><kbd>↑</kbd><kbd>↓</kbd><em>browse</em></span></p>
      <p class="k-scroll"><span><kbd>↑</kbd><kbd>↓</kbd><em>scroll</em></span></p>
    </div>
    <button class="theme" id="theme" type="button" aria-label="Toggle dark mode" title="Toggle dark mode"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.75a6.25 6.25 0 0 1 0 12.5z" fill="currentColor"/></svg></button>
    <a class="hub" id="hub" href="#index" aria-label="Wagner Rosa, home">
      <img src="../../assets/wagnerrosa-picture.jpg" alt="" width="76" height="76">
      <span><b>Wagner Rosa</b><span class="role">Product Designer</span><span class="status mono"><i></i>Open to remote</span></span>
    </a>
  </aside>
  <main class="stage" id="stage"></main>
</div>
<script src="../shared/site.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);

  const items = SITE.items, N = items.length;
  const side = document.querySelector('.side'), list = $('list'), wheel = $('wheel'), stage = $('stage'), rim = $('rim'), hub = $('hub'), pointer = $('pointer');
  list.innerHTML = items.map(i =>
    `<li class="${i.level ? 'child' : ''}"><a href="#${i.id}" data-id="${i.id}" tabindex="-1"><span class="mono n">${i.n}</span><span>${i.label}</span>${i.id === 'cases' ? `<sup>${i.tag}</sup>` : ''}</a></li>`).join('');
  const els = [...list.children];

  /* slot space (small gear): one slot per item, a new section gets a little extra air */
  const slots = [];
  items.forEach((it, k) => { slots[k] = k === 0 ? 0 : slots[k - 1] + (it.level === 0 ? 1.6 : 1); });
  const maxSlot = slots[N - 1];
  const nearest = v => { let b = 0; slots.forEach((s, k) => { if (Math.abs(s - v) < Math.abs(slots[b] - v)) b = k; }); return b; };
  const clamp = v => Math.min(Math.max(v, 0), maxSlot);
  /* slot -> fractional item index (big gear: one full panel per item) */
  const slotToIdx = v => {
    let k = 0; while (k < N - 2 && v > slots[k + 1]) k++;
    return k + Math.min(Math.max((v - slots[k]) / (slots[k + 1] - slots[k]), 0), 1);
  };

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const start = Math.max(0, items.findIndex(i => i.id === SITE.currentId()));
  let pos = slots[start];      // animated slot position
  let target = pos;            // where we are heading
  let shown = null, W = 0, H = 0, R = 0, step = 0, gap = 0, cx = 0, cy = 0, baseX = 0, stageH = 0;
  let lastPos = null, ticksG = null;
  let sc = null;               // smooth in-page scroll: { el, t }

  /* ---------- right pane ---------- */
  const ARC_SEL = '.eyebrow, .title, .lede, .facts > div, .bullets li, .sub, .rows li, .timeline li, .links, .prose > *';
  const layers = new Map();          // item index -> { el, arcEls }
  let arcDirty = true, arcMax = 56;
  let reading = null, readRot = 0, readRotS = 0, lastRot = Infinity, lockF = 0, lastReadK = -1, exitLi = null, interacted = false;   // reading mode state

  function makeLayer(k) {
    const el = document.createElement('div');
    el.className = 'layer';
    el.innerHTML = SITE.panel(items[k].id);
    stage.appendChild(el);
    const arcEls = [...el.querySelectorAll(ARC_SEL)];
    arcEls.forEach(a => a.setAttribute('data-arc', ''));
    el.addEventListener('scroll', () => { arcDirty = true; }, { passive: true });
    const figs = [...el.querySelectorAll('.fig')].map(f => ({ f, imgs: [...f.querySelectorAll('img')] }));
    figs.forEach(g => g.imgs.forEach(im => { im.style.willChange = 'transform, opacity'; }));
    const L = { el, arcEls, figs };
    layers.set(k, L);
    return L;
  }

  /* panel k sits (k - ip) stage-heights from the centre: the next one rises from below */
  function syncLayers(ip) {
    const lo = Math.max(0, Math.floor(ip)), hi = Math.min(N - 1, Math.ceil(ip));
    for (const [k, L] of layers) if (k < lo || k > hi) { L.el.remove(); layers.delete(k); }
    for (let k = lo; k <= hi; k++) {
      const L = layers.get(k) || makeLayer(k);
      const off = (k - ip) * stageH;
      L.el.style.transform = off === 0 ? '' : `translateY(${off.toFixed(1)}px)`;
      L.el.style.pointerEvents = Math.abs(k - ip) < 0.5 ? '' : 'none';
      L.el.setAttribute('aria-hidden', Math.abs(k - ip) < 0.5 ? 'false' : 'true');
    }
  }

  /* photos: rise + fade + settle as they enter, drift up faster and fade as they leave (the 2nd one lags a little) */
  function figFx({ f, imgs }, sr) {
    const r = f.getBoundingClientRect(), h = r.height || 1;
    const enter = Math.min(1, Math.max(0, (sr.bottom - r.top) / (h * 0.7)));
    const leave = Math.min(1, Math.max(0, (r.bottom - sr.top) / (h * 0.7)));
    const v = Math.min(enter, leave), dir = enter < leave ? 1 : -1;
    imgs.forEach((im, i) => {
      const vv = Math.min(1, v * (1 + i * 0.25)), e = (1 - vv) * (1 - vv);   // ease: strongest at the edges
      im.style.transform = e < 0.001 ? '' : `translateY(${(dir * e * (90 + i * 40)).toFixed(1)}px) scale(${(1 - e * 0.06).toFixed(3)})`;
      im.style.opacity = (1 - e * 0.9).toFixed(2);
    });
  }

  /* lines drift: centre of the stage sits furthest right (same ")" as the wheel), top/bottom pull left */
  function arcUpdate() {
    if (reduce) return;
    const sr = stage.getBoundingClientRect(), mid = sr.top + sr.height / 2, half = sr.height / 2;
    const apply = L => {
      const ts = L.arcEls.map(el => { const r = el.getBoundingClientRect(); return (r.top + r.height / 2 - mid) / half; });
      L.arcEls.forEach((el, i) => {
        const t = Math.min(1, Math.abs(ts[i]));
        el.style.transform = `translateX(${(arcMax * (1 - t * t)).toFixed(1)}px)`;
      });
      L.figs.forEach(g => figFx(g, sr));
    };
    layers.forEach(apply);
    if (reading && reading.el) apply(reading);              // the article drifts on the same arc as the other pages
  }


  /* ---------- reading mode (experiment: only the case studies listed here) ---------- */
  const READABLE = new Set(['iel-rs-ux-redesign', 'building-a-sub-500ms-site-2026', 'planton-academy', 'planton-ui-design-system', 'planton-website-vision-to-production']);   // public articles; Genius (password) and Carburante (external) stay outside
  const readOrder = items.filter(i => i.c && READABLE.has(i.c.id)).map(i => i.c.id);
  const READ_TURN = 1.1;               // radians the dial turns over a whole article

  async function openReading(id, pushed = true, swap = false) {
    if (reading || !READABLE.has(id)) return;
    const hid = 'case-' + id, c = SITE.byId[hid].c;
    reading = { id: hid, el: null, pushed: false };            // claim the slot while fetching
    let doc;
    try {
      const res = await fetch(c.href);
      if (!res.ok) throw new Error(res.status);
      doc = new DOMParser().parseFromString(await res.text(), 'text/html');
    } catch (err) { reading = null; location.href = c.href; return; }
    const main = doc.querySelector('main');
    if (!main) { reading = null; location.href = c.href; return; }
    main.querySelectorAll('script, style').forEach(n => n.remove());
    main.querySelectorAll('*').forEach(n => {              // drop the live site's Tailwind classes, keep the few content components
      const keep = [...n.classList].filter(k => /^(pull-quote|code-block|badge)$/.test(k));
      n.removeAttribute('class');
      if (keep.length) n.className = keep.join(' ');
      const src = n.getAttribute('src');
      if (src) n.setAttribute('src', src.replace(/^(\.\.\/|\/)assets\//, '../../assets/'));
    });
    const el = document.createElement('div');
    el.className = 'layer read';
    el.setAttribute('role', 'article'); el.tabIndex = -1;
    el.innerHTML = `<div class="read-body"><p class="mono eyebrow">[ Case studies / ${c.year} ]</p>${main.innerHTML}<div class="read-end" data-arc><p class="mono">End of case study</p>${readOrder.length > 1 ? '<a href="#next" data-next>Next case study →</a>' : ''}<a href="#cases" data-exit>All case studies ↑</a><a href="#index" data-home>Home ↑</a></div></div>`;
    el.style.transform = 'translateY(100%)';
    stage.appendChild(el);
    const figs = [...el.querySelectorAll('figure')].map(f => ({ f, imgs: [...f.querySelectorAll('img')] }));
    const arcEls = [...el.querySelectorAll('.read-body > *')];
    arcEls.forEach(a => a.setAttribute('data-arc', ''));
    const readK = items.findIndex(i => i.id === hid);
    const prog = document.createElement('sup'); prog.className = 'prog'; prog.textContent = '0%';
    if (els[readK]) els[readK].querySelector('a').appendChild(prog);
    wheel.classList.add('locked');
    pointer.removeAttribute('aria-hidden'); pointer.setAttribute('role', 'button'); pointer.setAttribute('aria-label', 'Close case study');
    exitLi = document.createElement('li');
    exitLi.className = 'child exit';
    exitLi.innerHTML = '<a href="#cases" data-exit tabindex="-1"><span>All case studies ↑</span></a>';
    list.appendChild(exitLi);
    go(readK);                                             // bring the wheel to this case, wherever the link was clicked from
    reading = { id: hid, el, figs, arcEls, pushed, readK, prog };
    if (swap) history.replaceState(null, '', '#' + hid + '/read');
    else if (pushed) history.pushState(null, '', '#' + hid + '/read');
    el.addEventListener('scroll', () => {
      const max = el.scrollHeight - el.clientHeight;
      const p = max > 0 ? el.scrollTop / max : 0;
      readRot = p * READ_TURN;
      reading && (reading.prog.textContent = Math.round(p * 100) + '%');
      arcDirty = true;
    }, { passive: true });
    el.getBoundingClientRect();                            // commit the start position so the slide-in animates
    el.style.transform = 'translateY(0)';
    arcDirty = true;
    el.focus({ preventScroll: true });
  }

  function closeReading(popped, keep) {
    if (!reading || !reading.el) return;
    const r = reading; reading = null; readRot = 0;
    r.prog.remove();
    if (!keep) { wheel.classList.remove('locked'); pointer.setAttribute('aria-hidden', 'true'); pointer.removeAttribute('role'); pointer.removeAttribute('aria-label'); }
    const xl = exitLi; setTimeout(() => { xl.remove(); if (exitLi === xl) exitLi = null; }, keep ? 60 : 700);
    if (!popped) history.replaceState(null, '', '#' + r.id);
    if (!keep) { r.el.style.transform = 'translateY(100%)'; r.el.style.pointerEvents = 'none'; }   // when swapping, the old article stays put under the new one sliding in
    setTimeout(() => r.el.remove(), keep ? 1000 : 850);
  }

  /* Space / Shift+Space (or the link at the end): jump to the next / previous readable case study */
  function switchReading(dir) {
    if (!reading || !reading.el || readOrder.length < 2) return;
    const cur = readOrder.indexOf(reading.id.replace(/^case-/, ''));
    const next = readOrder[(cur + dir + readOrder.length) % readOrder.length], pushed = reading.pushed;
    closeReading(true, true);
    openReading(next, pushed, true);
  }

  function exitReading() {
    if (!reading || !reading.el) return;
    if (reading.pushed) history.back();                    // hashchange closes it, so the browser Back button does the same thing
    else closeReading();
  }

  /* ---------- wheel (left) ---------- */
  function layout() {
    const r = wheel.getBoundingClientRect();
    W = r.width; H = r.height;
    stageH = stage.clientHeight;
    const stacked = innerWidth <= 820;
    cy = H / 2;
    R = Math.min(H * 0.62, 420);                       // big circle, centre off-screen: only half the arc shows
    if (!stacked) {
      baseX = Math.min(W * 0.6, 244);                // x of the active row
      gap = Math.min(66, Math.max(46, H * 0.07));
      hub.style.top = cy + 'px';
    } else {
      baseX = W * 0.3;
      gap = Math.min(46, Math.max(34, H * 0.1));
      hub.style.top = '';
    }
    cx = baseX - R - 18;
    step = gap / R;
    rim.setAttribute('viewBox', `0 0 ${W} ${H}`);
    let ticks = '';
    const dt2 = step / 2;                                  // graduation like a dial: two ticks per row, every 4th a bit longer
    for (let j = Math.ceil(-1.6 / dt2); j <= Math.floor((1.6 + maxSlot * step) / dt2); j++) {   // enough ticks to cover the whole turn of the wheel
      const a = j * dt2, c = Math.cos(a), sn = Math.sin(a), len = j % 4 === 0 ? 11 : 5;
      ticks += `<line class="${j % 4 === 0 ? 'major' : ''}" x1="${(cx + (R - 4) * c).toFixed(1)}" y1="${(cy + (R - 4) * sn).toFixed(1)}" x2="${(cx + (R - 4 - len) * c).toFixed(1)}" y2="${(cy + (R - 4 - len) * sn).toFixed(1)}"/>`;
    }
    rim.innerHTML = `<circle cx="${cx}" cy="${cy}" r="${R}"/><g id="ticks">${ticks}</g>`;
    ticksG = rim.querySelector('#ticks');
    pointer.style.left = (cx + R) + 'px'; pointer.style.top = cy + 'px';
    arcMax = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--arc')) || 56;
    lastPos = null; lastRot = Infinity;
  }

  /* two cascaded exponential smoothers = ease-in and ease-out, independent of the frame rate */
  let soft = pos, lastT = 0;
  function frame(now) {
    const dt = Math.min(0.05, (now - (lastT || now)) / 1000); lastT = now;
    if (reduce) { soft = pos = target; }
    else {
      soft += (target - soft) * (1 - Math.exp(-dt * 14));
      pos += (soft - pos) * (1 - Math.exp(-dt * 7));
      if (Math.abs(target - pos) < 0.0005 && Math.abs(target - soft) < 0.0005) pos = soft = target;
    }
    if (sc) {                                           // smooth scroll inside the current page
      const d = sc.t - sc.el.scrollTop;
      if (Math.abs(d) < 0.5) { sc.el.scrollTop = sc.t; sc = null; }
      else { sc.el.scrollTop += d * (1 - Math.exp(-dt * 11)); }
      arcDirty = true;
    }

    lockF = reduce ? (reading ? 1 : 0) : lockF + ((reading && reading.el ? 1 : 0) - lockF) * (1 - Math.exp(-dt * 8));
    const readK = reading && reading.el ? reading.readK : lastReadK;   // keep the right row bright while the lock eases out
    if (reading && reading.el) lastReadK = reading.readK;
    const place = (el, slot, mult) => {
      const th = (slot - pos) * step;
      const x = cx + R * Math.cos(th) + 18;
      if (Math.abs(th) > 1.15 || x < 4) { el.style.opacity = 0; el.style.pointerEvents = 'none'; return; }
      const y = cy + R * Math.sin(th);
      const s = 1 - Math.abs(th) * 0.16;
      const op = Math.max(0, 1 - Math.abs(th) * 0.8) * Math.min(1, Math.max(0, (x - 24) / 70)) * mult;   // also fade as a row nears the left edge, so nothing is cut mid-word
      el.style.opacity = op.toFixed(3);
      el.style.pointerEvents = op < 0.05 ? 'none' : '';
      const bl = Math.max(0, Math.abs(th) - 0.3) * 2.6;   // depth: rows leaving the centre soften
      el.style.filter = bl > 0.05 ? `blur(${bl.toFixed(2)}px)` : '';
      el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) translateY(-50%) scale(${s.toFixed(3)})`;
      el.style.transformOrigin = '0 50%';
    };
    els.forEach((el, k) => place(el, slots[k], k === readK ? 1 : k === readK - 1 ? 1 - lockF : 1 - lockF * 0.72));   // the row above the open case makes room for the exit row
    if (exitLi) place(exitLi, slots[lastReadK] - 1, lockF);

    const rd = !!(reading && reading.el);
    if (shown) interacted = true;                         // leaving Home counts as interacting
    side.classList.toggle('k-nav', interacted && !rd && !!shown);   // Home stays clean: the hint shows from Nelogica down
    side.classList.toggle('k-enter', !reading && shown != null && !!items[shown].c && READABLE.has(items[shown].c.id));
    side.classList.toggle('k-close', rd);
    side.classList.toggle('k-next', rd && readOrder.length > 1);
    side.classList.toggle('k-scroll', rd);
    readRotS = reduce ? readRot : readRotS + (readRot - readRotS) * (1 - Math.exp(-dt * 9));
    if (Math.abs(readRotS - readRot) < 0.0002) readRotS = readRot;
    const rotChanged = readRotS !== lastRot;
    if (rotChanged || pos !== lastPos) {                // the dial turns with the wheel, and with reading progress on top
      lastRot = readRotS;
      if (ticksG) ticksG.setAttribute('transform', `rotate(${(-(pos * step + readRotS) * 180 / Math.PI).toFixed(3)} ${cx} ${cy})`);
    }
    if (pos !== lastPos) {
      lastPos = pos;
      syncLayers(slotToIdx(clamp(pos)));
      arcDirty = true;
      const idx = nearest(clamp(pos));
      if (idx !== shown) {
        shown = idx;
        SITE.setActive(list, items[idx].id);
        history.replaceState(null, '', '#' + items[idx].id + (reading ? '/read' : ''));
      }
    }
    if (arcDirty) { arcDirty = false; arcUpdate(); }

    requestAnimationFrame(frame);
  }

  const go = k => { target = slots[Math.min(Math.max(k, 0), N - 1)]; };

  /* wheel / trackpad: accumulate, snap when input goes quiet */
  let snapT;
  wheel.addEventListener('wheel', e => {
    e.preventDefault();
    if (reading) return;                                 // gear is locked while reading
    target = clamp(target + e.deltaY / 220);
    clearTimeout(snapT); snapT = setTimeout(() => go(nearest(target)), 110);
  }, { passive: false });

  /* right pane: scroll the page; once it hits the top/bottom, keep going and the wheel turns to the next/previous page */
  let edgeAcc = 0, edgeT;
  stage.addEventListener('wheel', e => {
    if (reading) return;                                 // the article scrolls natively; no page turning
    const idx = nearest(clamp(pos)), L = layers.get(idx);
    const moving = Math.abs(target - slots[idx]) > 0.04 || Math.abs(pos - slots[idx]) > 0.04;
    if (!moving && L) {
      const el = L.el, dy = e.deltaY, maxS = el.scrollHeight - el.clientHeight;
      const cur = sc && sc.el === el ? sc.t : el.scrollTop;
      const atBottom = cur >= maxS - 1, atTop = cur <= 0;
      if ((dy > 0 && !atBottom) || (dy < 0 && !atTop)) {   // scroll inside the page, eased
        e.preventDefault(); edgeAcc = 0;
        sc = { el, t: Math.min(Math.max(cur + dy, 0), maxS) };
        return;
      }
    }
    e.preventDefault();
    if (Math.sign(edgeAcc) !== Math.sign(e.deltaY)) edgeAcc = 0;
    edgeAcc += e.deltaY;
    clearTimeout(edgeT); edgeT = setTimeout(() => { edgeAcc = 0; }, 220);
    if (!moving && Math.abs(edgeAcc) < 60) return;          // small resistance at the edge, so momentum does not flip pages by accident
    target = clamp(target + e.deltaY / 260);
    clearTimeout(snapT); snapT = setTimeout(() => go(nearest(target)), 140);
  }, { passive: false });
  stage.addEventListener('pointerdown', () => { sc = null; });
  addEventListener('keydown', () => { sc = null; }, true);

  /* drag (mouse + touch) */
  let drag = null;
  wheel.addEventListener('pointerdown', e => { drag = { y: e.clientY, t: target, moved: false }; });
  wheel.addEventListener('pointermove', e => {
    if (!drag || reading) return;
    const dy = drag.y - e.clientY;
    if (!drag.moved && Math.abs(dy) > 4) { drag.moved = true; wheel.setPointerCapture(e.pointerId); }   // capture only once it is a real drag, so plain clicks still reach the links
    if (drag.moved) target = clamp(drag.t + dy / gap);
  });
  const end = () => { if (drag && drag.moved) go(nearest(target)); setTimeout(() => { drag = null; }, 0); };
  wheel.addEventListener('pointerup', end); wheel.addEventListener('pointercancel', end);

  /* click on a row */
  list.addEventListener('click', e => {
    const a = e.target.closest('a'); if (!a) return;
    e.preventDefault();
    if (drag && drag.moved) return;
    if (a.hasAttribute('data-exit')) { closeReading(); go(items.findIndex(i => i.id === 'cases')); return; }
    const wasReading = !!reading;
    if (reading) closeReading();
    const k = items.findIndex(i => i.id === a.dataset.id), it = items[k];
    if (!wasReading && it && it.c && READABLE.has(it.c.id) && k === nearest(clamp(pos)) && Math.abs(pos - target) < 0.04) { openReading(it.c.id); return; }   // clicking the row the wheel already rests on opens the article
    go(k);
  });

  addEventListener('keydown', e => {
    if (reading) {
      if (e.key === 'Escape' || e.key === 'ArrowLeft') { e.preventDefault(); exitReading(); }
      else if (e.key === ' ') { e.preventDefault(); switchReading(e.shiftKey ? -1 : 1); }
      else if (reading.el && document.activeElement !== reading.el && ['ArrowUp', 'ArrowDown', 'PageUp', 'PageDown', 'Home', 'End'].includes(e.key)) reading.el.focus({ preventScroll: true });   // keep the keyboard on the article, even after a click on the wheel
      return;
    }
    if (e.key === 'ArrowRight' && !e.metaKey && !e.ctrlKey && !e.altKey) {   // → opens the case study the wheel is resting on
      const it = items[nearest(clamp(pos))];
      if (it.c && READABLE.has(it.c.id) && Math.abs(pos - target) < 0.04) { e.preventDefault(); openReading(it.c.id); return; }
    }
    if (e.target.closest && e.target.closest('.stage')) return;
    if (e.key === 'ArrowDown' || e.key === 'j') { e.preventDefault(); go(nearest(target) + 1); }
    if (e.key === 'ArrowUp' || e.key === 'k') { e.preventDefault(); go(nearest(target) - 1); }
  });
  pointer.addEventListener('click', e => { if (reading) { e.stopPropagation(); exitReading(); } });
  stage.addEventListener('click', e => {
    const a = e.target.closest('a');
    if (a && reading && a.hasAttribute('data-exit')) { e.preventDefault(); closeReading(); go(items.findIndex(i => i.id === 'cases')); return; }
    if (a && reading && a.hasAttribute('data-next')) { e.preventDefault(); switchReading(1); return; }
    if (a && reading && a.hasAttribute('data-home')) { e.preventDefault(); closeReading(); go(0); return; }
    const m = a && !reading && !e.metaKey && !e.ctrlKey && !e.shiftKey && (a.getAttribute('href') || '').match(/\/case-studies\/([^/]+)\.html$/);
    if (m && READABLE.has(m[1])) { e.preventDefault(); openReading(m[1]); }
  });
  addEventListener('hashchange', () => {
    const h = location.hash.slice(1);
    if (reading && reading.el && !h.endsWith('/read')) closeReading(true);
    else if (!reading && h.endsWith('/read')) openReading(h.split('/')[0].replace(/^case-/, ''), false);
    const k = items.findIndex(i => i.id === SITE.currentId()); if (k >= 0 && k !== shown) go(k); });
  ['wheel', 'keydown', 'pointerdown'].forEach(t => addEventListener(t, () => { interacted = true; }, { capture: true, passive: true }));
  addEventListener('resize', layout);
  $('theme').addEventListener('click', () => {
    const root = document.documentElement, dark = matchMedia('(prefers-color-scheme: dark)').matches;
    const cur = root.dataset.theme || (dark ? 'dark' : 'light'), next = cur === 'dark' ? 'light' : 'dark';
    root.dataset.theme = next;
    try { localStorage.setItem('theme', next); } catch (e) {}
    $('theme').blur();
  });

  layout();
  requestAnimationFrame(frame);
  if (location.hash.endsWith('/read')) openReading(location.hash.slice(1).split('/')[0].replace(/^case-/, ''), false);   // deep link straight into an article
})();
</script>
</body>
</html>
