<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C · Wheel — Wagner Rosa (prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&family=Inter:opsz,wght@14..32,400..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<script>try { var t = localStorage.getItem('theme'); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="stylesheet" href="../shared/base.css">
<style>
  .shell { --side: minmax(400px, min(31vw, 500px)); }
  .side { padding: 0; overflow: visible; position: relative; z-index: 6; border-right: 0; }   /* visible so a long label + its % can pass the column edge */

  .wheel { position: absolute; inset: 0; cursor: grab; touch-action: none; outline: none; }
  .wheel:active { cursor: grabbing; }
  /* fade the rows out before they reach the footer text */
  .wheel ul { -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 10%, #000 82%, transparent 96%); mask-image: linear-gradient(to bottom, transparent 0, #000 10%, #000 82%, transparent 96%); }
  .wheel ul { position: absolute; inset: 0 -90px 0 0; }   /* wider than the column: the mask would otherwise clip a long label + its % at the edge */
  .wheel li { position: absolute; left: 0; top: 0; will-change: transform, opacity; white-space: nowrap; }
  .wheel a {
    display: flex; align-items: baseline; gap: 10px; text-decoration: none;
    font-family: var(--display); font-size: clamp(26px, 2.6vw, 38px); font-weight: 500; letter-spacing: -.035em; line-height: 1;
    transition: color .25s;
  }
  .wheel a .n { display: none; }
  .wheel a { font-weight: 500; }
  .wheel a.on { color: var(--accent); font-weight: 600; }
  .wheel a sup { align-self: flex-start; font-size: .36em; font-weight: 500; letter-spacing: .04em; color: var(--mute); margin-left: -2px; transform: translateY(.6em); }
  .wheel a.on sup { color: var(--accent); }
  /* children: a step smaller, lighter, indented under their section */
  .wheel li.child a { font-size: clamp(16px, 1.5vw, 21px); font-weight: 500; letter-spacing: -.02em; padding-left: 32px; color: var(--ink-2); }
  .wheel li.child a.on { color: var(--accent); font-weight: 700; }

  /* the rim: only half of a big circle shows; photo + name sit inside the visible half */
  .rim { position: absolute; inset: 0; pointer-events: none; width: 100%; height: 100%; }
  .rim circle { fill: none; stroke: var(--line); stroke-width: 1; }
  .rim line { stroke: var(--line); stroke-width: 1; }
  .rim line.major { stroke: var(--line-strong); }
  .pointer { position: absolute; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); transform: translate(-50%, -50%); z-index: 2; pointer-events: none; }
  .hub {
    position: absolute; z-index: 3; left: 44px; display: flex; flex-direction: column; align-items: flex-start; gap: 0;
    text-align: left; text-decoration: none; transform: translateY(-50%);
  }
  .hub > span { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; }
  .hub img { width: clamp(64px, 5.6vw, 84px); height: clamp(64px, 5.6vw, 84px); border-radius: 50%; object-fit: cover; margin-bottom: 14px; }
  .hub b { font-family: var(--display); font-size: 17px; font-weight: 600; letter-spacing: -.03em; line-height: 1.1; white-space: nowrap; }
  .hub .role { color: var(--mute); font-size: 13px; font-weight: 500; letter-spacing: -.01em; line-height: 1.3; white-space: nowrap; }
  .hub .mono { color: var(--mute); font-size: 9px; line-height: 1.35; white-space: nowrap; }
  .hub .status { margin-top: 10px; font-size: 9px; white-space: nowrap; }
  /* right pane: a vertical stack of panels driven by the same wheel (the bigger gear) */
  :root { --arc: 56px; }
  .stage { overflow: hidden; }
  .layer { position: absolute; inset: 0; overflow-x: hidden; overflow-y: auto; background: var(--paper); will-change: transform; }
  .panel .in { padding-left: clamp(20px, 2.6cqi, 40px); padding-right: calc(clamp(20px, 5cqi, 64px) + var(--arc)); }   /* room for the arc */
  [data-arc] { will-change: transform; }

  /* reading mode: a case study article locks the gear; the dial then shows reading progress */
  .layer.read { z-index: 4; outline: none; overscroll-behavior: contain; transition: transform .8s cubic-bezier(.2, .8, .2, 1); }
  /* locked gear: the rim turns blue, the pointer becomes a ring, the other rows step back and the active one counts progress */
  .rim circle { transition: stroke .6s; }
  .pointer { transition: width .4s, height .4s, background .4s, box-shadow .4s; }
  .wheel.locked .rim circle { stroke: rgb(var(--accent-rgb) / .5); }
  /* locked: the pointer turns into a close button (x) sitting on the rim */
  .wheel.locked .pointer { width: 24px; height: 24px; background: var(--paper); box-shadow: 0 0 0 1.5px var(--accent), 0 0 0 8px rgb(var(--accent-rgb) / .1); pointer-events: auto; cursor: pointer; }
  .pointer::before, .pointer::after { content: ''; position: absolute; left: 50%; top: 50%; width: 10px; height: 1.5px; margin: -.75px 0 0 -5px; border-radius: 1px; background: #fff; opacity: 0; transform: rotate(0); transition: opacity .3s, transform .4s, background .2s; }
  .wheel.locked .pointer::before { opacity: 1; background: var(--accent); transform: rotate(45deg); }
  .wheel.locked .pointer::after { opacity: 1; background: var(--accent); transform: rotate(-45deg); }
  .wheel.locked .pointer:hover { background: var(--accent); }
  .wheel.locked .pointer:hover::before, .wheel.locked .pointer:hover::after { background: var(--paper); }
  /* keyboard hints as key caps, bottom-left of the gear. They appear gradually: browse once the visitor interacts, enter on a readable case, close + scroll while reading */
  .keys { position: absolute; z-index: 3; left: 44px; bottom: 26px; pointer-events: none; }
  .keys p { display: grid; grid-template-rows: 0fr; margin: 0; opacity: 0; transition: grid-template-rows .45s cubic-bezier(.2, .8, .2, 1), opacity .45s; }
  .keys p > span { display: flex; align-items: center; gap: 5px; min-height: 0; overflow: hidden; padding: 4px 0; box-sizing: border-box; }
  .keys p > span > * { flex: none; }
  .keys .kbd { appearance: none; -webkit-appearance: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; min-width: 24px; height: 24px; padding: 0 7px; box-sizing: border-box; font: 600 11px/1 var(--sans); letter-spacing: 0; color: var(--ink); background: var(--chip); border: 1px solid var(--chip-line); border-bottom-width: 2px; border-radius: 6px; transition: color .2s, border-color .2s, background .2s, transform .1s; }
  .keys em { margin-left: 5px; font: 500 12px/1 var(--sans); font-style: normal; letter-spacing: -.005em; color: var(--mute); }
  .side.k-nav .k-nav, .side.k-enter .k-enter, .side.k-close .k-close, .side.k-next .k-next, .side.k-scroll .k-scroll { grid-template-rows: 1fr; opacity: 1; pointer-events: auto; }
  /* the key caps are buttons: they run what the hint says. Hover turns them blue, like the links */
  .keys p { pointer-events: none; }
  .keys .one > span { cursor: pointer; }
  .keys .kbd:hover, .keys .one > span:hover .kbd { color: var(--accent); border-color: var(--accent); background: rgb(var(--accent-rgb) / .08); }
  .keys .one > span:hover em { color: var(--accent); }
  .keys .kbd:active { transform: translateY(1px); }
  .keys em { transition: color .2s; }
  /* private case: password gate inside the layer */
  .read-body .gate-copy { max-width: 32em; font: 400 18px/1.5 var(--sans); letter-spacing: -.01em; color: var(--mute); }
  .read-body .gate { display: flex; gap: 10px; max-width: 420px; }
  .read-body .gate input { flex: 1; min-width: 0; height: 44px; padding: 0 14px; font: 500 16px/1 var(--sans); letter-spacing: 0; color: var(--ink); background: transparent; border: 1px solid var(--line-strong); border-radius: 10px; outline: none; transition: border-color .2s, box-shadow .2s; }
  .read-body .gate input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgb(var(--accent-rgb) / .16); }
  .read-body .gate button { height: 44px; padding: 0 20px; font: 600 15px/1 var(--sans); letter-spacing: -.005em; color: var(--paper); background: var(--accent); border: 0; border-radius: 10px; cursor: pointer; transition: opacity .2s; }
  .read-body .gate button:hover { opacity: .88; }
  .read-body .gate.busy { opacity: .55; pointer-events: none; }
  .read-body .gate.shake { animation: shake .4s; }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
  .read-body .gate-msg { min-height: 1.4em; margin-top: 12px; font: 500 14px/1.4 var(--sans); letter-spacing: -.005em; color: var(--mute); }
  .read-body .gate-msg.err { color: #e5484d; }
  .read-body .gate-note { margin-top: 28px; font: 400 14px/1.4 var(--sans); color: var(--mute); }
  .read-body.reveal { animation: reveal .7s cubic-bezier(.2, .8, .2, 1); }
  @keyframes reveal { from { opacity: 0; transform: translateY(14px); } }
  .read-body .read-end { margin-top: 4em; padding-top: 22px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 28px; font-family: var(--sans); }
  .read-body .read-end .mono { color: var(--mute); flex-basis: 100%; }
  .read-body .read-end a { font-weight: 600; font-size: 16px; letter-spacing: -.01em; }
  .wheel li.exit a { color: var(--accent); font-weight: 600; }
  .wheel li.exit a:hover { text-decoration: underline; text-underline-offset: .2em; text-decoration-thickness: 1px; }
  .wheel a sup.prog { align-self: baseline; transform: translateY(-2.5px);   /* sits on the label baseline, nudged up to the optical middle of the label */ margin-left: 10px; font: 600 11px/1 var(--sans); letter-spacing: .04em; color: var(--accent); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .read-body { max-width: 700px; padding: 40px 40px 160px; margin-left: clamp(0px, 3vw, 48px); font-family: 'Source Serif 4', Georgia, serif; font-size: clamp(18px, 1.35vw, 20px); line-height: 1.7; color: var(--read); letter-spacing: 0; }
  .read-body > * + * { margin-top: 1.3em; }
  .read-body h1 { font: 500 clamp(32px, 3.6vw, 48px)/1.1 var(--display); letter-spacing: -.04em; color: var(--ink); }
  .read-body h1 + p { margin-top: .9em; font: 500 12px/1.3 var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--mute); }
  .read-body h2 { margin-top: 2.6em; font: 500 clamp(23px, 2vw, 28px)/1.2 var(--display); letter-spacing: -.03em; color: var(--ink); }
  .read-body h3 { margin-top: 2em; font: 500 clamp(18px, 1.5vw, 21px)/1.25 var(--display); letter-spacing: -.02em; color: var(--ink); }
  .read-body h2 + *, .read-body h3 + * { margin-top: .8em; }
  .read-body strong { font-weight: 600; }
  .read-body a { color: var(--link); text-decoration: underline; text-underline-offset: .18em; text-decoration-thickness: 1px; }
  .read-body figure { margin-top: 2.2em; margin-bottom: 2.2em; }
  .read-body figure img { display: block; width: 100%; height: auto; border-radius: 6px; will-change: transform, opacity; }
  .read-body figure img + img { margin-top: 14px; }
  .read-body figcaption { margin-top: 10px; font: 400 13px/1.45 var(--sans); color: var(--mute); letter-spacing: -.005em; }
  .read-body ul, .read-body ol { padding-left: 1.3em; }
  .read-body li + li { margin-top: .4em; }
  .read-body blockquote { padding-left: 1.2em; border-left: 1px solid var(--line-strong); font-style: italic; }
  .read-body code { font: 500 .86em ui-monospace, Menlo, monospace; background: var(--code); padding: .1em .35em; border-radius: 4px; }
  .read-body pre { overflow-x: auto; background: var(--code-block); padding: 16px; border-radius: 6px; font-size: 14px; line-height: 1.5; }
  .read-body hr { border: 0; border-top: 1px solid var(--line); margin: 2.4em 0; }
  .read-body video { display: block; width: 100%; height: auto; border-radius: 6px; }
  .read-body dl { display: grid; gap: 1.1em; }
  .read-body dl > div { padding-left: 16px; border-left: 1px solid var(--line); }
  .read-body dt { font: 600 15px/1.3 var(--sans); letter-spacing: -.01em; color: var(--ink); }
  .read-body dd { margin: .3em 0 0; }
  .read-body .code-block { border-radius: 6px; overflow: hidden; background: var(--code-block); font-family: var(--sans); }
  .read-body .code-block > div { padding: 8px 16px; font: 500 11px/1 var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--mute); border-bottom: 1px solid var(--line); }
  .read-body .code-block pre { margin: 0; border-radius: 0; }
  .read-body .badge { display: inline-block; padding: 2px 8px; border-radius: 99px; background: var(--code); font: 500 12px/1.4 var(--sans); }
  .read-body table { width: 100%; border-collapse: collapse; font: 400 15px/1.4 var(--sans); }
  .read-body th, .read-body td { text-align: left; padding: 10px 12px 10px 0; vertical-align: top; }
  .read-body tr + tr > * { border-top: 1px solid var(--line); }

  /* theme toggle: top-left corner of the gear column */
  .theme { position: absolute; z-index: 7; top: 22px; left: 44px; width: 32px; height: 32px; display: grid; place-items: center; padding: 0; border: 1px solid var(--line); border-radius: 50%; background: transparent; color: var(--mute); cursor: pointer; transition: color .2s, border-color .2s, background .2s; }
  .theme:hover { color: var(--ink); border-color: var(--line-strong); }
  .theme svg { width: 15px; height: 15px; display: block; }
  .edge { display: none; }   /* mobile touch handle for the arc */
  @media (max-width: 820px) {
    :root { --arc: 12px; }
    /* iOS ignores overflow:hidden on body and lets the whole document pan (toolbars, rubber band), which shifts everything up and leaves a gap below.
       Pin the document to the visible area instead: nothing but the page layers scrolls. */
    html { overflow: hidden; overscroll-behavior: none; }
    body { position: fixed; inset: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; }
    .shell { height: 100%; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
    .theme { top: 12px; left: auto; right: 16px; }
    .keys { display: none; }
    /* content owns the whole screen; the gear column becomes a fixed layer on top of it */
    .side { position: fixed; inset: 0; pointer-events: none; border: 0; padding: 0; z-index: 6; }
    .side::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 68px; background: linear-gradient(to bottom, var(--paper) 58%, transparent); z-index: 1; }   /* the page scrolls under the header */
    .panel .in { padding-top: 76px; padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
    .read-body { padding: 84px 20px calc(120px + env(safe-area-inset-bottom)) calc(20px + var(--arc)); margin-left: 0; }
    .layer { overscroll-behavior-y: contain; }
    .hub { top: 12px !important; left: 16px !important; transform: none; flex-direction: row; gap: 10px; text-align: left; z-index: 3; pointer-events: auto; }
    .hub img { width: 36px; height: 36px; margin: 0; }
    .hub b { font-size: 17px; }
    .hub .role { font-size: 12px; }
    .hub > span { align-items: flex-start; gap: 1px; }
    .theme { z-index: 3; pointer-events: auto; }
    .panel .in { padding-left: calc(clamp(20px, 5cqi, 64px) + var(--arc)); }   /* room for the drift to the left */

    /* the arc is always there: a slim rim on the right edge (ticks turn, the dot marks the page). Touch it and the labels open next to it, over a light scrim */
    .wheel { z-index: 2; top: 0; pointer-events: none; touch-action: none; }
    .wheel::before { content: ''; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .3s; background: var(--paper); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); -webkit-mask-image: linear-gradient(to left, #000, rgb(0 0 0 / .78) 40%, rgb(0 0 0 / .3)); mask-image: linear-gradient(to left, #000, rgb(0 0 0 / .78) 40%, rgb(0 0 0 / .3)); }
    .m-open .wheel { pointer-events: auto; }
    .m-open .wheel::before { opacity: 1; }
    .wheel ul { inset: 0; opacity: 0; visibility: hidden; transition: opacity .25s, visibility 0s .25s; }
    .m-open .wheel ul { opacity: 1; visibility: visible; transition: opacity .25s; }
    .wheel a { font-size: 28px; text-shadow: 0 0 16px var(--paper), 0 0 6px var(--paper); }
    .wheel li.child a { font-size: 18px; padding-left: 0; padding-right: 20px; }
    .wheel li.exit { display: none; }
    .pointer { z-index: 2; }
    .edge { display: block; position: absolute; right: 0; width: 56px; pointer-events: auto; touch-action: none; -webkit-tap-highlight-color: transparent; }
    .m-open .edge, .wheel.locked .edge { pointer-events: none; }
    /* sheet open: the dot becomes the close button, same as the locked gear while reading */
    .m-open .pointer { width: 24px; height: 24px; background: var(--paper); box-shadow: 0 0 0 1.5px var(--accent), 0 0 0 8px rgb(var(--accent-rgb) / .1); pointer-events: auto; cursor: pointer; }
    .m-open .pointer::before, .m-open .pointer::after { opacity: 1; background: var(--accent); }
    .m-open .pointer::before { transform: rotate(45deg); }
    .m-open .pointer::after { transform: rotate(-45deg); }
    .rim circle { stroke: var(--line-strong); }
    .read-body { padding-right: 46px; }   /* clears the close button sitting on the rim */
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="wheel" id="wheel" tabindex="0" role="listbox" aria-label="Sections">
      <svg class="rim" id="rim" aria-hidden="true"></svg>
      <div class="pointer" id="pointer" aria-hidden="true"></div>
      <ul id="list"></ul>
      <div class="edge" id="edge" aria-hidden="true"></div>
    </div>
    <div class="keys">
      <p class="k-enter one"><span data-k="enter"><button class="kbd" type="button" tabindex="-1" aria-label="Read the case study">→</button><em>read the case study</em></span></p>
      <p class="k-close one"><span data-k="close"><button class="kbd" type="button" tabindex="-1" aria-label="Close">Esc</button><button class="kbd" type="button" tabindex="-1" aria-label="Close">←</button><em>close</em></span></p>
      <p class="k-next one"><span data-k="next"><button class="kbd" type="button" tabindex="-1" aria-label="Next case study">Space</button><em>next case study</em></span></p>
      <p class="k-nav"><span><button class="kbd" type="button" tabindex="-1" data-k="up" aria-label="Browse up">↑</button><button class="kbd" type="button" tabindex="-1" data-k="down" aria-label="Browse down">↓</button><em>browse</em></span></p>
      <p class="k-scroll"><span><button class="kbd" type="button" tabindex="-1" data-k="scroll-up" aria-label="Scroll up">↑</button><button class="kbd" type="button" tabindex="-1" data-k="scroll-down" aria-label="Scroll down">↓</button><em>scroll</em></span></p>
    </div>
    <button class="theme" id="theme" type="button" aria-label="Toggle dark mode" title="Toggle dark mode"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.75a6.25 6.25 0 0 1 0 12.5z" fill="currentColor"/></svg></button>
    <a class="hub" id="hub" href="#index" aria-label="Wagner Rosa, home">
      <img src="../../assets/wagnerrosa-picture.jpg" alt="" width="76" height="76">
      <span><b>Wagner Rosa</b><span class="role">Product Designer</span><span class="status mono"><i></i>Open to remote</span></span>
    </a>
  </aside>
  <main class="stage" id="stage"></main>
</div>
<script src="../shared/site.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);

  const items = SITE.items, N = items.length;
  const edge = $('edge'), mq = matchMedia('(max-width: 820px)');
  const side = document.querySelector('.side'), list = $('list'), wheel = $('wheel'), stage = $('stage'), rim = $('rim'), hub = $('hub'), pointer = $('pointer');
  list.innerHTML = items.map(i =>
    `<li class="${i.level ? 'child' : ''}"><a href="#${i.id}" data-id="${i.id}" tabindex="-1"><span class="mono n">${i.n}</span><span>${i.label}</span>${i.id === 'cases' ? `<sup>${i.tag}</sup>` : ''}</a></li>`).join('');
  const els = [...list.children];

  /* slot space (small gear): one slot per item, a new section gets a little extra air */
  const slots = [];
  items.forEach((it, k) => { slots[k] = k === 0 ? 0 : slots[k - 1] + (it.level === 0 ? 1.6 : 1); });
  const maxSlot = slots[N - 1];
  const nearest = v => { let b = 0; slots.forEach((s, k) => { if (Math.abs(s - v) < Math.abs(slots[b] - v)) b = k; }); return b; };
  const clamp = v => Math.min(Math.max(v, 0), maxSlot);
  /* slot -> fractional item index (big gear: one full panel per item) */
  /* detents, like a picker wheel: next to an option the wheel lingers (it takes more finger travel to leave it), and past the halfway point it
     moves quickly on to the next one. Maps a raw slot position to a "magnetised" one; continuous, and it keeps every slot and every midpoint fixed. */
  const MAGNET = 1.8;
  const magnet = raw => {
    const v = clamp(raw), k = nearest(v), s = slots[k], d = v - s;
    const nb = slots[k + (d >= 0 ? 1 : -1)];
    const half = nb == null ? 0.5 : Math.abs(nb - s) / 2, t = Math.min(1, Math.abs(d) / half);
    return s + Math.sign(d) * half * Math.pow(t, MAGNET);
  };
  const slotToIdx = v => {
    let k = 0; while (k < N - 2 && v > slots[k + 1]) k++;
    return k + Math.min(Math.max((v - slots[k]) / (slots[k + 1] - slots[k]), 0), 1);
  };

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const start = Math.max(0, items.findIndex(i => i.id === SITE.currentId()));
  let pos = slots[start];      // animated slot position
  let target = pos;            // where we are heading
  let shown = null, W = 0, H = 0, R = 0, step = 0, gap = 0, cx = 0, cy = 0, baseX = 0, stageH = 0;
  let lastPos = null, ticksG = null, mirror = false, sheet = false;   // mirror: small screens, the gear sits on the right edge and the labels hang to its left
  let sc = null;               // smooth in-page scroll: { el, t }

  /* ---------- right pane ---------- */
  const ARC_SEL = '.title, .lede, .facts > div, .bullets li, .sub, .rows li, .timeline li, .links, .prose > *';
  const layers = new Map();          // item index -> { el, arcEls }
  let arcDirty = true, arcMax = 56;
  let reading = null, readRot = 0, readRotS = 0, lastRot = Infinity, lockF = 0, lastReadK = -1, exitLi = null, interacted = false;   // reading mode state

  function makeLayer(k) {
    const el = document.createElement('div');
    el.className = 'layer';

      const before = nearest(target);
      target = magnet(drag.t + dy / gap);
      if (nearest(target) !== before && navigator.vibrate) navigator.vibrate(6);   // a tick as each option passes, where the browser allows it (not iOS)
      const now = performance.now(); drag.s.push({ t: now, y: e.clientY }); while (drag.s.length > 2 && now - drag.s[0].t > 120) drag.s.shift();
    }
  });
  const end = () => {
    if (drag && drag.moved) {                            // let a flick carry on a little, then settle on the nearest option
      const now = performance.now(), r = drag.s.filter(q => now - q.t < 100), a = r[0], b = r[r.length - 1], dt = a && b ? b.t - a.t : 0;   // only a finger still moving at release counts
      const v = dt > 16 ? (a.y - b.y) / dt * 1000 / gap : 0;   // options per second, finger up = forward
      go(nearest(clamp(target + Math.max(-2, Math.min(2, v * 0.07)))));
    }
    setTimeout(() => { drag = null; }, 0);
  };
  wheel.addEventListener('pointerup', end); wheel.addEventListener('pointercancel', end);

  wheel.addEventListener('click', e => { if (sheet && !e.target.closest('a') && !(drag && drag.moved)) setSheet(false); });   // tap outside the rows closes the sheet
  /* touch: pull past the end (or the start) of a page and the arc opens and moves one page on, like the scroll wheel does on desktop.
     It takes a deliberate pull; a second, shorter try right after the first bounced off the edge also counts. */
  const PULL = 120, PULL_AGAIN = 56;   // px of finger travel past the edge: first try / a second try right after a bounce
  let pull = null, lastTry = { t: 0, dir: 0 };
  const touchY = e => e.touches[0].clientY;
  /* the touch keeps targeting the element it started on, even after the wheel has swapped that page out of the DOM,
     so the move / end listeners live on that element instead of on the stage */
  /* rubber band: the page follows the finger with growing resistance, then springs back (the native bounce is off now that the document is pinned) */
  function rubber(d) {
    const n = pull.el.firstElementChild;
    if (!n || !!pull.off === !!d && !d) return;
    pull.off = d;
    n.style.transition = d ? 'none' : 'transform .55s cubic-bezier(.2, .9, .25, 1.15)';
    n.style.transform = d ? `translateY(${(-pull.dir * d).toFixed(1)}px)` : '';
  }
  function pullMove(e) {
    if (!pull) return;
    const y = touchY(e);
    if (pull.on) { rubber(0); e.preventDefault(); pull.at = performance.now(); return; }   // one step per pull: the rest of this gesture is spent, the arc takes over from here
    const dir = y < pull.last ? 1 : y > pull.last ? -1 : pull.dir;   // finger up = reading further down
    pull.last = y;
    const el = pull.el, max = el.scrollHeight - el.clientHeight;
    const atEdge = dir > 0 ? el.scrollTop >= max - 1 : dir < 0 && el.scrollTop <= 0;
    if (!atEdge) { rubber(0); pull.ey = null; pull.dir = dir; return; }
    if (pull.ey == null || pull.dir !== dir) { pull.ey = y; pull.dir = dir; }
    const dist = (pull.ey - y) * dir, again = lastTry.dir === dir && e.timeStamp - lastTry.t < 2000;
    pull.dist = dist;
    rubber(dist > 0 ? 64 * (1 - Math.exp(-dist / 90)) : 0);
    if (dist > (again ? PULL_AGAIN : PULL)) {   // the pull has to be deliberate; from here the page steps once, then follows the finger
      pull.on = true; pull.at = performance.now(); setSheet(true); clearTimeout(autoT); e.preventDefault(); go(nearest(clamp(target + dir)));
    }
  }
  function settlePull() {
    go(nearest(target));                                  // never leave the wheel between two pages (on iOS touchend can go missing)
    clearTimeout(autoT); autoT = setTimeout(() => setSheet(false), 2600);   // long enough to grab the arc and keep going
  }
  function pullEnd(e) {
    if (!pull) return;
    rubber(0);
    pull.node.removeEventListener('touchmove', pullMove); pull.node.removeEventListener('touchend', pullEnd); pull.node.removeEventListener('touchcancel', pullEnd);
    if (pull.on) settlePull();
    else if (pull.dist > 24) lastTry = { t: e.timeStamp, dir: pull.dir };   // bounced off the edge: the next try needs less
    pull = null;
  }
  stage.addEventListener('touchstart', e => {
    const el = e.target.closest('.layer');
    pull = mirror && !reading && !sheet && el && !el.classList.contains('read') && e.touches.length === 1 ? { el, node: e.target, last: touchY(e), ey: null, dir: 0, on: false } : null;
    if (!pull) return;
    pull.node.addEventListener('touchmove', pullMove, { passive: false });
    pull.node.addEventListener('touchend', pullEnd); pull.node.addEventListener('touchcancel', pullEnd);
  }, { passive: true });

  /* click on a row */
  list.addEventListener('click', e => {
    const a = e.target.closest('a'); if (!a) return;
    e.preventDefault();
    if (drag && drag.moved) return;
    if (a.hasAttribute('data-exit')) { closeReading(); go(items.findIndex(i => i.id === 'cases')); return; }
    if (sheet) setTimeout(() => setSheet(false), 220);   // picking a row dismisses the sheet (a beat later, so the choice registers)
    const wasReading = !!reading;
    if (reading) closeReading();
    const k = items.findIndex(i => i.id === a.dataset.id), it = items[k];
    if (!wasReading && it && it.c && READABLE.has(it.c.id) && k === nearest(clamp(pos)) && Math.abs(pos - target) < 0.04) { openReading(it.c.id); return; }   // clicking the row the wheel already rests on opens the article
    go(k);
  });

  stage.addEventListener('scroll', () => { if (stage.scrollTop || stage.scrollLeft) stage.scrollTop = stage.scrollLeft = 0; });   // only the layers scroll; a focused field must never drag the stage itself
  addEventListener('keydown', e => {
    if (e.target.closest && e.target.closest('input, textarea')) {   // typing a password
      const t = e.target;
      if (reading && (e.key === 'Escape' || (e.key === 'ArrowLeft' && !t.value))) { e.preventDefault(); exitReading(); }   // ← leaves too while the field is empty
      else if (reading && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) { e.preventDefault(); t.blur(); reading.el.focus({ preventScroll: true }); }   // ↑ ↓ hand the keyboard back to the layer
      return;
    }
    if (sheet && e.key === 'Escape') { e.preventDefault(); setSheet(false); return; }
    if (reading) {
      if (e.key === 'Escape' || e.key === 'ArrowLeft') { e.preventDefault(); exitReading(); }
      else if (e.key === ' ') { e.preventDefault(); switchReading(e.shiftKey ? -1 : 1); }
      else if (reading.el && document.activeElement !== reading.el && ['ArrowUp', 'ArrowDown', 'PageUp', 'PageDown', 'Home', 'End'].includes(e.key)) reading.el.focus({ preventScroll: true });   // keep the keyboard on the article, even after a click on the wheel
      return;
    }
    if (e.key === 'ArrowRight' && !e.metaKey && !e.ctrlKey && !e.altKey) {   // → opens the case study the wheel is resting on
      const it = items[nearest(clamp(pos))];
      if (it.c && READABLE.has(it.c.id) && Math.abs(pos - target) < 0.04) { e.preventDefault(); openReading(it.c.id); return; }
    }
    if (e.target.closest && e.target.closest('.stage')) return;
    if (e.key === 'ArrowDown' || e.key === 'j') { e.preventDefault(); go(nearest(target) + 1); }
    if (e.key === 'ArrowUp' || e.key === 'k') { e.preventDefault(); go(nearest(target) - 1); }
  });
  /* key caps act as buttons: reuse the keyboard handler, so guards and behaviour stay in one place */
  const keysEl = document.querySelector('.keys');
  const press = key => dispatchEvent(new KeyboardEvent('keydown', { key, bubbles: true, cancelable: true }));
  keysEl.addEventListener('mousedown', e => e.preventDefault());   // keep focus where it was, so Space doesn't re-press the button
  keysEl.addEventListener('click', e => {
    const t = e.target.closest('[data-k]'); if (!t) return;
    const k = t.dataset.k;
    if (k === 'enter') press('ArrowRight');
    else if (k === 'close') press('Escape');
    else if (k === 'next') press(' ');
    else if (k === 'up') press('ArrowUp');
    else if (k === 'down') press('ArrowDown');
    else if (reading && reading.el) reading.el.scrollBy({ top: (k === 'scroll-up' ? -1 : 1) * reading.el.clientHeight * .6, behavior: 'smooth' });
  });
  pointer.addEventListener('click', e => { if (reading) { e.stopPropagation(); exitReading(); } else if (sheet) { e.stopPropagation(); setSheet(false); } });
  stage.addEventListener('click', e => {
    const a = e.target.closest('a');
    if (a && reading && a.hasAttribute('data-exit')) { e.preventDefault(); closeReading(); go(items.findIndex(i => i.id === 'cases')); return; }
    if (a && reading && a.hasAttribute('data-next')) { e.preventDefault(); switchReading(1); return; }
    if (a && reading && a.hasAttribute('data-home')) { e.preventDefault(); closeReading(); go(0); return; }
    const m = a && !reading && !e.metaKey && !e.ctrlKey && !e.shiftKey && (a.getAttribute('href') || '').match(/\/case-studies\/([^/]+)\.html$/);
    if (m && READABLE.has(m[1])) { e.preventDefault(); openReading(m[1]); }
  });
  addEventListener('hashchange', () => {
    const h = location.hash.slice(1);
    if (reading && reading.el && !h.endsWith('/read')) closeReading(true);
    else if (!reading && h.endsWith('/read')) openReading(h.split('/')[0].replace(/^case-/, ''), false);
    const k = items.findIndex(i => i.id === SITE.currentId()); if (k >= 0 && k !== shown) go(k); });
  ['wheel', 'keydown', 'pointerdown'].forEach(t => addEventListener(t, () => { interacted = true; }, { capture: true, passive: true }));
  addEventListener('resize', () => { layout(); layers.forEach(L => fitCheck(L.el)); });
  if (document.fonts) document.fonts.ready.then(() => layers.forEach(L => fitCheck(L.el)));   // text reflows once the web fonts land
  if (window.visualViewport) visualViewport.addEventListener('resize', layout);   // iOS toolbars sliding in and out change the visible height
  addEventListener('scroll', () => { if (scrollX || scrollY) scrollTo(0, 0); }, { passive: true });   // the document itself must never move
  $('theme').addEventListener('click', () => {
    const root = document.documentElement, dark = matchMedia('(prefers-color-scheme: dark)').matches;
    const cur = root.dataset.theme || (dark ? 'dark' : 'light'), next = cur === 'dark' ? 'light' : 'dark';
    root.dataset.theme = next;
    try { localStorage.setItem('theme', next); } catch (e) {}
    $('theme').blur();
  });

  layout();
  requestAnimationFrame(frame);
  if (location.hash.endsWith('/read')) openReading(location.hash.slice(1).split('/')[0].replace(/^case-/, ''), false);   // deep link straight into an article
})();
</script>
</body>
