<!-- The password screen's content, rendered inside the site shell by src/pages/protected-gate/[name].astro. That page becomes the
     staticrypt template (see build-protected.sh), so this fragment keeps staticrypt's placeholders (the slash-star-pipe markers below) and its form
     ids. Standalone on purpose: the page is encrypted into the blob, so it cannot use the site's bundles; the shell's stylesheet is
     already linked by the page itself. -->
<section class="panel gate">
  <div class="in">
    <div id="staticrypt_loading" class="gate-loading" role="status" aria-label="Loading"><span class="gate-spin"></span></div>

    <div id="staticrypt_content" class="hidden">
      <p class="nf-code">Private case study</p>
      <h1 class="nf-title">/*[|template_title|]*/0</h1>
      <p class="lede lead-in">/*[|template_instructions|]*/0</p>

      <form id="staticrypt-form" class="gate-form" action="#" method="post">
        <input type="text" name="username" value="" autocomplete="username" hidden aria-hidden="true" tabindex="-1" />
        <label class="gate-label" for="staticrypt-password">/*[|template_placeholder|]*/0</label>

        <div class="gate-field">
          <input id="staticrypt-password" class="gate-input" type="password" name="password" placeholder="Enter the password" autocomplete="current-password" autofocus />
          <button id="staticrypt-toggle" class="gate-eye" type="button" aria-label="/*[|template_toggle_show|]*/0" aria-pressed="false" title="/*[|template_toggle_show|]*/0">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1 8s2.6-4.5 7-4.5S15 8 15 8s-2.6 4.5-7 4.5S1 8 1 8z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="8" cy="8" r="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path class="gate-slash" d="M2.5 13.5l11-11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          </button>
        </div>

        <!-- Static hint: staticrypt has no --template-hint variable, so this is hardcoded.
             Update it here when the password changes. -->
        <p id="staticrypt-hint" class="gate-hint">Hint: Coni and Pipi.</p>

        <p id="staticrypt-error" class="gate-error hidden" role="alert">/*[|template_error|]*/0</p>

        <label id="staticrypt-remember-label" class="gate-remember hidden">
          <input id="staticrypt-remember" type="checkbox" name="remember" />
          /*[|template_remember|]*/0
        </label>

        <button type="submit" class="gate-button">/*[|template_button|]*/0</button>
      </form>

      <p class="gate-note">The product is live: <a href="https://genius.planton.eco.br/" target="_blank" rel="noopener">genius.planton.eco.br ↗</a></p>
      <p class="gate-note">No password? <a href="mailto:contato@wagnerrosa.com">Get in touch</a> and I'll share access.</p>
      <p class="gate-note gate-back"><a href="/case-studies/">Back to case studies →</a></p>
    </div>
  </div>
</section>

<style>
  .hidden { display: none !important; }
  .gate { --gate-error: #c62828; }
  :root[data-theme="dark"] .gate { --gate-error: #f87171; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .gate { --gate-error: #f87171; } }
  .gate .in { padding-top: clamp(40px, 9cqi, 120px); }
  .gate-loading { display: flex; align-items: center; justify-content: center; min-height: 40vh; }
  .gate-spin { width: 28px; height: 28px; border: 2px solid var(--line-strong); border-top-color: var(--accent); border-radius: 50%; animation: gate-spin .7s linear infinite; }
  @keyframes gate-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .gate-spin { animation-duration: 3s; } }

  .gate-form { display: flex; flex-direction: column; max-width: 22rem; margin-top: clamp(24px, 3.6cqi, 40px); }
  .gate-label { font: 500 11px/1.3 var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--mute); margin-bottom: 8px; }
  .gate-field { position: relative; display: flex; align-items: center; }
  .gate-input { width: 100%; font: 400 17px/1.3 var(--sans); letter-spacing: -.01em; color: var(--ink); background: var(--paper); border: 1px solid var(--line-strong); border-radius: 10px; padding: 12px 44px 12px 14px; }
  .gate-input::placeholder { color: var(--mute); }
  .gate-input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-color: var(--accent); }
  .gate-eye { position: absolute; right: 4px; width: 40px; height: 40px; display: grid; place-items: center; background: none; border: 0; border-radius: 8px; color: var(--mute); cursor: pointer; }
  .gate-eye svg { width: 17px; height: 17px; }
  .gate-eye[aria-pressed="true"] .gate-slash { display: none; }
  @media (hover: hover) { .gate-eye:hover { color: var(--ink); } }
  .gate-hint, .gate-error { font: 400 14px/1.5 var(--sans); margin-top: 8px; }
  .gate-hint { color: var(--mute); }
  .gate-error { color: var(--gate-error); }
  .gate-remember { display: flex; align-items: center; gap: 8px; font: 400 14px/1.4 var(--sans); color: var(--mute); margin-top: 16px; }
  .gate-remember input { accent-color: var(--accent); }
  .gate-button { font: 600 16px/1 var(--sans); letter-spacing: -.01em; color: var(--paper); background: var(--link); border: 0; border-radius: 10px; padding: 14px 16px; margin-top: 20px; cursor: pointer; transition: opacity .15s; }
  @media (hover: hover) { .gate-button:hover { opacity: .88; } }
  .gate-note { font: 400 15px/1.6 var(--sans); color: var(--mute); margin-top: 20px; max-width: 32em; }
  .gate-note + .gate-note { margin-top: 8px; }
  .gate-note a { color: var(--ink); }
  .gate-back { margin-top: clamp(32px, 5cqi, 56px); }
</style>

<script>
  // these variables will be filled when generating the file - the template format is '/*[|variable_name|]*/0'
  const staticryptInitiator = /*[|js_staticrypt|]*/ 0;
  const templateError = "/*[|template_error|]*/0",
    templateToggleAltShow = "/*[|template_toggle_show|]*/0",
    templateToggleAltHide = "/*[|template_toggle_hide|]*/0",
    isRememberEnabled = /*[|is_remember_enabled|]*/ 0,
    staticryptConfig = /*[|staticrypt_config|]*/ 0;

  // you can edit these values to customize some of the behavior of StatiCrypt
  const templateConfig = {
    rememberExpirationKey: "staticrypt_expiration",
    rememberPassphraseKey: "staticrypt_passphrase",
    replaceHtmlCallback: null,
    clearLocalStorageCallback: null,
  };

  // init the staticrypt engine
  const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);

  // try to automatically decrypt on load if there is a saved password
  window.onload = async function () {
    const { isSuccessful } = await staticrypt.handleDecryptOnLoad();

    // if we didn't decrypt anything on load, show the password prompt. Otherwise the content has already been
    // replaced, no need to do anything
    if (!isSuccessful) {
      document.getElementById("staticrypt_loading").classList.add("hidden");
      document.getElementById("staticrypt_content").classList.remove("hidden");
      document.getElementById("staticrypt-password").focus();

      // show the remember me checkbox
      if (isRememberEnabled) {
        document.getElementById("staticrypt-remember-label").classList.remove("hidden");
      }
    }
  };

  // toggle password visibility
  const eye = document.getElementById("staticrypt-toggle");
  eye.addEventListener("click", function () {
    const passwordInput = document.getElementById("staticrypt-password");
    const show = passwordInput.type === "password";
    passwordInput.type = show ? "text" : "password";
    const label = show ? templateToggleAltHide : templateToggleAltShow;
    eye.setAttribute("aria-label", label);
    eye.title = label;
    eye.setAttribute("aria-pressed", String(show));
  });

  // handle password form submission
  document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
    e.preventDefault();

    const password = document.getElementById("staticrypt-password").value,
      isRememberChecked = document.getElementById("staticrypt-remember").checked;

    const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, isRememberChecked);

    const errorEl = document.getElementById("staticrypt-error");
    const hintEl = document.getElementById("staticrypt-hint");

    if (!isSuccessful) {
      // inline error instead of a browser alert; it takes the hint's place
      errorEl.classList.remove("hidden");
      hintEl.classList.add("hidden");
      document.getElementById("staticrypt-password").focus();
    } else if (errorEl) {   // on success the decrypted page has already replaced this one
      errorEl.classList.add("hidden");
      hintEl.classList.remove("hidden");
    }
  });

  // clear the error and bring the hint back as soon as the user edits the field
  document.getElementById("staticrypt-password").addEventListener("input", function () {
    const errorEl = document.getElementById("staticrypt-error");
    if (!errorEl.classList.contains("hidden")) {
      errorEl.classList.add("hidden");
      document.getElementById("staticrypt-hint").classList.remove("hidden");
    }
  });
</script>
