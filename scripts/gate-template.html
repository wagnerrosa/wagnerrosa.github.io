  <script>

  <style>
    /* Same tokens as the site (src/styles/tokens.css). This page is standalone: it is encrypted, so it cannot use the site's bundle. */
    :root {
      --bg: #fff; --text: #3a3a3a; --heading: #000; --muted: #666; --border: rgb(0 0 0 / .14);
      --field-bg: #fff; --accent: #2563eb; --accent-hover: #1d4ed8; --error: #e5484d; --focus: rgb(37 99 235 / .16);
      color-scheme: light;
    }
    :root[data-theme="dark"] { --bg: #0a0a0a; --text: #d4d4d4; --heading: #f5f5f5; --muted: #a3a3a3; --border: rgb(255 255 255 / .14); --field-bg: #171717; --accent: #60a5fa; --accent-hover: #93c5fd; --error: #f87171; --focus: rgb(96 165 250 / .2); color-scheme: dark; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #0a0a0a; --text: #d4d4d4; --heading: #f5f5f5; --muted: #a3a3a3; --border: rgb(255 255 255 / .14); --field-bg: #171717; --accent: #60a5fa; --accent-hover: #93c5fd; --error: #f87171; --focus: rgb(96 165 250 / .2); color-scheme: dark; }
    }

    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    .hidden { display: none !important; }
    .sc-wrap { max-width: 42rem; margin: 0 auto; padding: 6rem 1.5rem 5rem; }
    @media (min-width: 640px) { .sc-wrap { padding-left: 2rem; padding-right: 2rem; } }
    @media (min-width: 1024px) { .sc-wrap { padding-left: 3rem; padding-right: 3rem; } }

    .sc-header { display: flex; align-items: center; margin-bottom: 2.5rem; }

    .sc-theme-toggle { margin-left: auto; font-size: 0.875rem; color: var(--muted); background: none; border: 0; padding: 0.25rem 0.5rem; border-radius: 0.25rem; cursor: pointer; font-family: inherit; }

    .sc-body { font-family: "Source Serif 4", ui-serif, Georgia, serif; font-size: 1.125rem; line-height: 1.667; margin: 0 0 2.25rem; max-width: 34rem; color: var(--text); }

    .sc-form { display: flex; flex-direction: column; align-items: stretch; max-width: 22rem; margin-bottom: 1.5rem; }
    .sc-label { font-size: 0.8125rem; font-weight: 500; color: var(--heading); margin-bottom: 0.4375rem; }
    .sc-hint { font-size: 0.8125rem; line-height: 1.5; color: var(--muted); margin: 0.5rem 0 0; }   /* directly under the field, where password hints conventionally sit */
    .sc-field { position: relative; display: flex; align-items: center; }
    .sc-input { width: 100%; font-family: inherit; font-size: 1rem; color: var(--text); background: var(--field-bg); border: 1px solid var(--border); border-radius: 0.625rem; padding: 0.75rem 2.5rem 0.75rem 0.875rem; }
    .sc-input::placeholder { color: var(--muted); }
    .sc-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus); }
    .sc-toggle-visibility { position: absolute; right: 0.75rem; width: 1rem; height: 1rem; opacity: 0.45; cursor: pointer; }
    :root[data-theme="dark"] .sc-toggle-visibility { filter: invert(1); opacity: 0.55; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .sc-toggle-visibility { filter: invert(1); opacity: 0.55; } }
    .sc-button { font-family: inherit; font-size: 0.9375rem; font-weight: 600; letter-spacing: -.005em; color: var(--bg); background: var(--accent); border: 0; border-radius: 0.625rem; padding: 0.75rem 1rem; margin-top: 1.25rem; cursor: pointer; transition: opacity 0.15s ease; }
    .sc-button:hover { opacity: .88; }
    .sc-button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .sc-remember { display: flex; align-items: center; gap: 0.5rem; font-size: 0.8125rem; color: var(--muted); margin-top: 1rem; }
    .sc-remember input { accent-color: var(--accent); }
    .sc-error { font-size: 0.8125rem; line-height: 1.5; color: var(--error); margin: 0.5rem 0 0; }
    .sc-note { font-size: 0.8125rem; line-height: 1.6; color: var(--muted); margin: 0; }
    .sc-note a, .sc-footer a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
    .sc-footer { margin-top: 3rem; padding-top: 2rem; border-top: 1px solid var(--border); display: flex; justify-content: space-between; }
    .sc-footer a { font-size: 1rem; text-decoration: none; }

    .sc-spinner-container { display: flex; align-items: center; justify-content: center; height: 100vh; }
    .sc-spinner { width: 2rem; height: 2rem; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 9999px; animation: sc-spin 0.7s linear infinite; }
    @keyframes sc-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .sc-button { transition: none; } .sc-spinner { animation-duration: 3s; } }
  </style>
</head>

  <script>
    // these variables will be filled when generating the file - the template format is '/*[|variable_name|]*/0'
    const staticryptInitiator = /*[|js_staticrypt|]*/ 0;
    const templateError = "/*[|template_error|]*/0",
      templateToggleAltShow = "/*[|template_toggle_show|]*/0",
      templateToggleAltHide = "/*[|template_toggle_hide|]*/0",
      isRememberEnabled = /*[|is_remember_enabled|]*/ 0,
      staticryptConfig = /*[|staticrypt_config|]*/ 0;

    // you can edit these values to customize some of the behavior of StatiCrypt
    const templateConfig = {
      rememberExpirationKey: "staticrypt_expiration",
      rememberPassphraseKey: "staticrypt_passphrase",
      replaceHtmlCallback: null,
      clearLocalStorageCallback: null,
    };

    // init the staticrypt engine
    const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);

    // theme toggle
    (function(){
      var r = document.documentElement;
      var b = document.getElementById('theme-toggle');
      if (b) {
        b.addEventListener('click', function () {
          var dark = matchMedia('(prefers-color-scheme: dark)').matches;
          var next = (r.dataset.theme || (dark ? 'dark' : 'light')) === 'dark' ? 'light' : 'dark';
          r.dataset.theme = next;
          try { localStorage.setItem('theme', next); } catch (e) {}
        });
      }
    })();

    // try to automatically decrypt on load if there is a saved password
    window.onload = async function () {
      const { isSuccessful } = await staticrypt.handleDecryptOnLoad();

      // if we didn't decrypt anything on load, show the password prompt. Otherwise the content has already been
      // replaced, no need to do anything
      if (!isSuccessful) {
        // hide loading screen
        document.getElementById("staticrypt_loading").classList.add("hidden");
        document.getElementById("staticrypt_content").classList.remove("hidden");
        document.getElementById("staticrypt-password").focus();

        // show the remember me checkbox
        if (isRememberEnabled) {
          document.getElementById("staticrypt-remember-label").classList.remove("hidden");
        }
      }
    };

    // toggle password visibility
    const toggleIcon = document.querySelector(".sc-toggle-visibility");
    // these two icons are coming from FontAwesome
    const imgSrcEyeClosed =
      "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NDAgNTEyIj48IS0tIUZvbnQgQXdlc29tZSBGcmVlIDYuNS4yIGJ5IEBmb250YXdlc29tZSAtIGh0dHBzOi8vZm9udGF3ZXNvbWUuY29tIExpY2Vuc2UgLSBodHRwczovL2ZvbnRhd2Vzb21lLmNvbS9saWNlbnNlL2ZyZWUgQ29weXJpZ2h0IDIwMjQgRm9udGljb25zLCBJbmMuLS0+PHBhdGggZD0iTTM4LjggNS4xQzI4LjQtMy4xIDEzLjMtMS4yIDUuMSA5LjJTLTEuMiAzNC43IDkuMiA0Mi45bDU5MiA0NjRjMTAuNCA4LjIgMjUuNSA2LjMgMzMuNy00LjFzNi4zLTI1LjUtNC4xLTMzLjdMNTI1LjYgMzg2LjdjMzkuNi00MC42IDY2LjQtODYuMSA3OS45LTExOC40YzMuMy03LjkgMy4zLTE2LjcgMC0yNC42Yy0xNC45LTM1LjctNDYuMi04Ny43LTkzLTEzMS4xQzQ2NS41IDY4LjggNDAwLjggMzIgMzIwIDMyYy02OC4yIDAtMTI1IDI2LjMtMTY5LjMgNjAuOEwzOC44IDUuMXpNMjIzLjEgMTQ5LjVDMjQ4LjYgMTI2LjIgMjgyLjcgMTEyIDMyMCAxMTJjNzkuNSAwIDE0NCA2NC41IDE0NCAxNDRjMCAyNC45LTYuMyA0OC4zLTE3LjQgNjguN0w0MDggMjk0LjVjOC40LTE5LjMgMTAuNi00MS40IDQuOC02My4zYy0xMS4xLTQxLjUtNDcuOC02OS40LTg4LjYtNzEuMWMtNS44LS4yLTkuMiA2LjEtNy40IDExLjdjMi4xIDYuNCAzLjMgMTMuMiAzLjMgMjAuM2MwIDEwLjItMi40IDE5LjgtNi42IDI4LjNsLTkwLjMtNzAuOHpNMzczIDM4OS45Yy0xNi40IDYuNS0zNC4zIDEwLjEtNTMgMTAuMWMtNzkuNSAwLTE0NC02NC41LTE0NC0xNDRjMC02LjkgLjUtMTMuNiAxLjQtMjAuMkw4My4xIDE2MS41QzYwLjMgMTkxLjIgNDQgMjIwLjggMzQuNSAyNDMuN2MtMy4zIDcuOS0zLjMgMTYuNyAwIDI0LjZjMTQuOSAzNS43IDQ2LjIgODcuNyA5MyAxMzEuMUMxNzQuNSA0NDMuMiAyMzkuMiA0ODAgMzIwIDQ4MGM0Ny44IDAgODkuOS0xMi45IDEyNi4yLTMyLjVMMzczIDM4OS45eiIvPjwvc3ZnPg==";
    const imgSrcEyeOpened =
      "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1NzYgNTEyIj48IS0tIUZvbnQgQXdlc29tZSBGcmVlIDYuNS4yIGJ5IEBmb250YXdlc29tZSAtIGh0dHBzOi8vZm9udGF3ZXNvbWUuY29tIExpY2Vuc2UgLSBodHRwczovL2ZvbnRhd2Vzb21lLmNvbS9saWNlbnNlL2ZyZWUgQ29weXJpZ2h0IDIwMjQgRm9udGljb25zLCBJbmMuLS0+PHBhdGggZD0iTTI4OCAzMmMtODAuOCAwLTE0NS41IDM2LjgtMTkyLjYgODAuNkM0OC42IDE1NiAxNy4zIDIwOCAyLjUgMjQzLjdjLTMuMyA3LjktMy4zIDE2LjcgMCAyNC42QzE3LjMgMzA0IDQ4LjYgMzU2IDk1LjQgMzk5LjRDMTQyLjUgNDQzLjIgMjA3LjIgNDgwIDI4OCA0ODBzMTQ1LjUtMzYuOCAxOTIuNi04MC42YzQ2LjgtNDMuNSA3OC4xLTk1LjQgOTMtMTMxLjFjMy4zLTcuOSAzLjMtMTYuNyAwLTI0LjZjLTE0LjktMzUuNy00Ni4yLTg3LjctOTMtMTMxLjFDNDMzLjUgNjguOCAzNjguOCAzMiAyODggMzJ6TTE0NCAyNTZhMTQ0IDE0NCAwIDEgMSAyODggMCAxNDQgMTQ0IDAgMSAxIC0yODggMHptMTQ0LTY0YzAgMzUuMy0yOC43IDY0LTY0IDY0Yy03LjEgMC0xMy45LTEuMi0yMC4zLTMuM2MtNS41LTEuOC0xMS45IDEuNi0xMS43IDcuNGMuMyA2LjkgMS4zIDEzLjggMy4yIDIwLjdjMTMuNyA1MS4yIDY2LjQgODEuNiAxMTcuNiA2Ny45czgxLjYtNjYuNCA2Ny45LTExNy42Yy0xMS4xLTQxLjUtNDcuOC02OS40LTg4LjYtNzEuMWMtNS44LS4yLTkuMiA2LjEtNy40IDExLjdjMi4xIDYuNCAzLjMgMTMuMiAzLjMgMjAuM3oiLz48L3N2Zz4=";
    toggleIcon.addEventListener("click", function () {
      const passwordInput = document.getElementById("staticrypt-password");
      if (passwordInput.type === "password") {
        passwordInput.type = "text";
        toggleIcon.src = imgSrcEyeOpened;
        toggleIcon.alt = templateToggleAltHide;
        toggleIcon.title = templateToggleAltHide;
      } else {
        passwordInput.type = "password";
        toggleIcon.src = imgSrcEyeClosed;
        toggleIcon.alt = templateToggleAltShow;
        toggleIcon.title = templateToggleAltShow;
      }
    });

    // handle password form submission
    document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
      e.preventDefault();

      const password = document.getElementById("staticrypt-password").value,
        isRememberChecked = document.getElementById("staticrypt-remember").checked;

      const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, isRememberChecked);

      const errorEl = document.getElementById("staticrypt-error");
      const hintEl = document.getElementById("staticrypt-hint");

      if (!isSuccessful) {
        // inline error instead of a browser alert; it takes the hint's place
        errorEl.textContent = templateError;
        errorEl.classList.remove("hidden");
        hintEl.classList.add("hidden");
        document.getElementById("staticrypt-password").focus();
      } else {
        errorEl.classList.add("hidden");
        hintEl.classList.remove("hidden");
      }
    });

    // clear the error and bring the hint back as soon as the user edits the field
    document.getElementById("staticrypt-password").addEventListener("input", function () {
      const errorEl = document.getElementById("staticrypt-error");
      if (!errorEl.classList.contains("hidden")) {
        errorEl.classList.add("hidden");
        document.getElementById("staticrypt-hint").classList.remove("hidden");
      }
    });
  </script>
