# GitHub Pages build settings. The site is plain static HTML; Jekyll only copies files.

# Don't render front-matter-less Markdown as HTML pages (jekyll-optional-front-matter).
# The ATS CV stays public as raw .md (assets/cv/Wagner-Rosa-CV-ATS-2026.md).
require_front_matter: true

# Internal docs, build config and scripts: kept in the repo, not published.
exclude:
  - CLAUDE.md
  - AGENTS.md
  - README.md
  - UTM_Link_Generator.md
  - package.json
  - package-lock.json
  - tailwind.config.js
  - input.css
  - scripts/
  - assets/og/og-template.html
  - node_modules/
